# Production overrides. Use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from dev:
#   - Postgres is not published to the host (only the app container reaches it
#     on the compose network).
#   - The app binds to 127.0.0.1:3000 so only the host-local Caddy reverse
#     proxy can reach it. Public TLS is terminated by Caddy on :443.
#   - The app reads its env from /etc/cloud-code/app.env on the host.

services:
  postgres:
    ports: !reset []

  app:
    env_file:
      - /etc/cloud-code/app.env
    ports: !override
      - "127.0.0.1:3000:3000"
    # Linux host: docker socket is gid 988 (group `docker`). Override the
    # dev-default of 0 (root) which is what Docker Desktop expects.
    group_add: !override
      - "988"
    environment:
      # Sandboxes also mount the host docker socket; match the host gid so
      # the non-root coder user can read it.
      SANDBOX_DOCKER_SOCK_GID: "988"
