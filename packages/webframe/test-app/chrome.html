<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>webframe test-app chrome</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: system-ui, sans-serif;
        background: #f5f5f5;
      }
      #tabbar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 12px;
        height: 48px;
        background: #2d2d30;
        color: #ddd;
        border-bottom: 1px solid #000;
      }
      #tabbar input {
        flex: 1;
        padding: 6px 10px;
        border-radius: 4px;
        border: 1px solid #555;
        background: #1e1e1e;
        color: #eee;
      }
      #urlbar {
        flex: 1;
      }
      #status {
        min-width: 260px;
        color: #9cdcfe;
        font-family: monospace;
        font-size: 11px;
      }
      button {
        padding: 4px 10px;
        background: #3a3d41;
        color: #eee;
        border: 1px solid #555;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background: #4a4d51;
      }
      #onepassword {
        display: none;
        font-weight: 700;
      }
      body[data-onepassword='1'] #onepassword {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      #log {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        max-height: 200px;
        overflow: auto;
        background: #1e1e1e;
        color: #b3b3b3;
        font-family: monospace;
        font-size: 11px;
        padding: 4px 12px;
      }
    </style>
  </head>
  <body>
    <div id="tabbar">
      <button id="back">‹</button>
      <button id="forward">›</button>
      <button id="reload">↻</button>
      <input id="urlbar" placeholder="https://…" />
      <button id="go">Go</button>
      <button id="devtools" title="Open DevTools for active tab">DevTools</button>
      <button id="onepassword" title="Open 1Password">1P</button>
      <button id="newtab">+ Tab</button>
      <button id="overlay">Overlay</button>
      <button id="detach-overlay">Detach</button>
      <button id="stress-overlay">Stress</button>
      <span id="status">no overlay</span>
    </div>
    <div id="log"></div>
    <script>
      const log = (...a) => {
        const el = document.getElementById('log');
        const line = document.createElement('div');
        line.textContent = a.map((x) => (typeof x === 'string' ? x : JSON.stringify(x))).join(' ');
        el.appendChild(line);
        el.scrollTop = el.scrollHeight;
      };
      window.__log = log;

      let currentTabId = null;
      let overlayId = null;
      let stressTimer = null;
      let stressSlotToggle = false;

      async function init() {
        const wf = window.webframe;
        if (!wf) {
          log('ERROR: window.webframe not available');
          return;
        }
        log('identity', await wf.identity());
        const windows = await wf.trpc.windows.list.query();
        log('windows', windows);

        // Publish slot for tab content area (below the chrome bar).
        const w = windows[0];
        await wf.trpc.windows.setSlots.mutate({
          windowId: w.id,
          slots: [
            { name: 'content', rect: { x: 0, y: 48, w: w.bounds.w, h: w.bounds.h - 48 } },
            { name: 'content-alt', rect: { x: 24, y: 72, w: Math.max(1, w.bounds.w - 48), h: Math.max(1, w.bounds.h - 96) } },
          ],
        });

        // Subscribe to tab changes.
        wf.trpc.tabs.onChange.subscribe(undefined, {
          onData: (ev) => log('tab:change', ev),
        });
        wf.trpc.tabs.onCreated.subscribe({ windowId: w.id }, {
          onData: (ev) => {
            currentTabId = ev.tab.id;
            document.getElementById('urlbar').value = ev.tab.url;
            log('tab:created', ev.tab.id, ev.tab.url);
          },
        });

        window.__wf = wf;
        window.__windowId = w.id;
        if (wf.onePassword) document.body.dataset.onepassword = '1';
        document.getElementById('urlbar').value = fixtureUrl('Initial tab', 'crimson');
        const existingTabs = await wf.trpc.tabs.list.query({ windowId: w.id });
        if (existingTabs[0]) {
          currentTabId = existingTabs[0].id;
          document.getElementById('urlbar').value = existingTabs[0].url;
        }
      }

      function fixtureUrl(title, color) {
        return (
          'data:text/html,' +
          encodeURIComponent(`<!doctype html>
            <title>${title}</title>
            <body style="margin:0;background:${color};color:white;font:32px system-ui;display:grid;place-items:center;height:100vh">
              <div>${title}<br><a href="https://example.com" target="_blank" style="color:white">target blank link</a></div>
            </body>`)
        );
      }

      function setStatus(text) {
        document.getElementById('status').textContent = text;
      }

      async function logOrder(label) {
        const windows = await window.__wf.trpc.windows.list.query();
        const overlays = await window.__wf.trpc.overlays.list.query({ windowId: window.__windowId });
        log(label, { window: windows.find((w) => w.id === window.__windowId), overlays });
      }

      document.getElementById('newtab').addEventListener('click', async () => {
        const url = document.getElementById('urlbar').value || fixtureUrl(`Tab ${Date.now()}`, 'royalblue');
        const rec = await window.__wf.trpc.tabs.create.mutate({
          url,
          windowId: window.__windowId,
          placement: { slot: 'content' },
          active: true,
        });
        currentTabId = rec.id;
        log('created tab', rec.id, url);
        await logOrder('after new tab');
      });

      document.getElementById('overlay').addEventListener('click', async () => {
        if (!overlayId) {
          const rec = await window.__wf.trpc.overlays.createDetached.mutate({
            url:
              'data:text/html,' +
              encodeURIComponent(`<!doctype html>
                <title>Overlay fixture</title>
                <body style="margin:0;background:rgba(0,0,0,.35);font:16px system-ui;color:white">
                  <div style="position:absolute;inset:0;display:grid;place-items:center">
                    <div style="width:420px;padding:24px;border:4px solid #22c55e;background:#052e16;box-shadow:0 20px 80px #000;border-radius:16px">
                      <h1 style="margin:0 0 8px;font-size:24px">WEBFRAME OVERLAY</h1>
                      <p>If this is correct, this green modal stays above every new tab.</p>
                      <input autofocus placeholder="type here" style="font-size:18px;padding:8px;width:100%" />
                    </div>
                  </div>
                </body>`),
            transparent: true,
          });
          overlayId = rec.id;
        }
        await window.__wf.trpc.overlays.attach.mutate({
          overlayId,
          windowId: window.__windowId,
          placement: { x: 0, y: 48, w: window.innerWidth, h: window.innerHeight - 48 },
        });
        setStatus(`overlay attached ${overlayId.slice(0, 8)}`);
        await logOrder('after overlay attach');
      });

      document.getElementById('detach-overlay').addEventListener('click', async () => {
        if (!overlayId) return;
        await window.__wf.trpc.overlays.detach.mutate({ overlayId });
        setStatus(`overlay detached ${overlayId.slice(0, 8)}`);
        await logOrder('after overlay detach');
      });

      document.getElementById('stress-overlay').addEventListener('click', async () => {
        if (stressTimer) {
          clearInterval(stressTimer);
          stressTimer = null;
          setStatus('stress stopped');
          return;
        }
        if (!overlayId) document.getElementById('overlay').click();
        let tick = 0;
        stressTimer = setInterval(async () => {
          try {
            tick += 1;
            const jitter = tick % 2 === 0 ? 0 : 12;
            stressSlotToggle = !stressSlotToggle;
            await window.__wf.trpc.windows.setSlots.mutate({
              windowId: window.__windowId,
              slots: [
                { name: 'content', rect: { x: 0, y: 48, w: window.innerWidth - jitter, h: window.innerHeight - 48 - jitter } },
                { name: 'content-alt', rect: { x: 24 + jitter, y: 72 + jitter, w: window.innerWidth - 48 - jitter, h: window.innerHeight - 96 - jitter } },
              ],
            });
            if (tick % 3 === 0) {
              const rec = await window.__wf.trpc.tabs.create.mutate({
                url: fixtureUrl(`Stress tab ${tick}`, tick % 2 === 0 ? 'purple' : 'teal'),
                windowId: window.__windowId,
                placement: { slot: 'content' },
                active: true,
              });
              currentTabId = rec.id;
            }
            if (currentTabId) {
              await window.__wf.trpc.tabs.move.mutate({
                tabId: currentTabId,
                windowId: window.__windowId,
                placement: { slot: stressSlotToggle ? 'content-alt' : 'content' },
              });
            }
            if (tick % 5 === 0 && currentTabId) {
              await window.__wf.trpc.tabs.setActive.mutate({ tabId: currentTabId, windowId: window.__windowId });
            }
            setStatus(`stress tick ${tick}`);
            if (tick % 10 === 0) await logOrder(`stress tick ${tick}`);
          } catch (e) {
            log('stress error', e.message);
          }
        }, 700);
        setStatus('stress running');
      });

      document.getElementById('go').addEventListener('click', async () => {
        if (!currentTabId) return;
        const url = document.getElementById('urlbar').value;
        await window.__wf.trpc.navigation.goto.mutate({ tabId: currentTabId, url });
      });

      document.getElementById('onepassword').addEventListener('click', async () => {
        if (!window.__wf?.onePassword) return;
        const extensionId = 'aeblfdkhhhdcdjpifhhbdiojplfjncoa';
        try {
          if (currentTabId) {
            await window.__wf.onePassword.triggerAction({ extensionId, tabId: currentTabId });
          }
          setStatus('1Password action triggered');
        } catch (e) {
          log('1password error', e.message);
          setStatus('1Password popup failed');
        }
      });

      document.getElementById('devtools').addEventListener('click', async () => {
        try {
          await window.__wf.devtools.openForTab({ tabId: currentTabId });
          setStatus('DevTools opened');
        } catch (e) {
          log('devtools error', e.message);
          setStatus('DevTools failed');
        }
      });

      document.getElementById('back').addEventListener('click', () => {
        if (currentTabId) window.__wf.trpc.navigation.back.mutate({ tabId: currentTabId });
      });
      document.getElementById('forward').addEventListener('click', () => {
        if (currentTabId) window.__wf.trpc.navigation.forward.mutate({ tabId: currentTabId });
      });
      document.getElementById('reload').addEventListener('click', () => {
        if (currentTabId) window.__wf.trpc.navigation.reload.mutate({ tabId: currentTabId });
      });

      init().catch((e) => log('init error', e.message));
    </script>
  </body>
</html>
