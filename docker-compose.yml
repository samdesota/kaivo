name: cloud-code

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudcode
      POSTGRES_PASSWORD: cloudcode
      POSTGRES_DB: cloudcode
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudcode -d cloudcode"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://cloudcode:cloudcode@postgres:5432/cloudcode
      DATA_DIR: /data
      # Host-side path bind-mounted below at /data; sandbox containers need
      # their workspace bind-mounted from the host filesystem (not the app
      # container's internal view) so the Docker daemon can find it.
      HOST_DATA_DIR: ${HOST_DATA_DIR:-${PWD}/data}
      PORT: "3000"
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      ADMIN_PASSWORD_BOOTSTRAP: ${ADMIN_PASSWORD_BOOTSTRAP:-}
      CC_SERVICE_CREDENTIAL: ${CC_SERVICE_CREDENTIAL:-local-dev-service-credential}
      SANDBOX_BASE_IMAGE: cloud-code-sandbox:dev
      DOCKER_NETWORK: cloud-code-net
      # Phase 4 bootstrap — first-start seeding for the encrypted secrets store.
      ANTHROPIC_API_KEY_BOOTSTRAP: ${ANTHROPIC_API_KEY_BOOTSTRAP:-}
      ANTHROPIC_BASE_URL_BOOTSTRAP: ${ANTHROPIC_BASE_URL_BOOTSTRAP:-}
      OPENAI_API_KEY_BOOTSTRAP: ${OPENAI_API_KEY_BOOTSTRAP:-}
      OPENAI_BASE_URL_BOOTSTRAP: ${OPENAI_BASE_URL_BOOTSTRAP:-}
    volumes:
      - ${HOST_DATA_DIR:-./data}:/data
      # Docker socket — app is the sole privileged boundary; it uses the
      # socket to spawn/exec sandbox containers and read their state.
      - /var/run/docker.sock:/var/run/docker.sock
    # macOS Docker Desktop maps host socket to a well-known gid; on Linux
    # operators may need to adjust. 0 (root) works for Docker Desktop.
    group_add:
      - "0"
    ports:
      - "3000:3000"
    networks:
      - default
      - sandbox-net
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:

networks:
  sandbox-net:
    name: cloud-code-net
