<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Click Events Test</title>
    <style>
      body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #08090b; color: #edf2f7; }
      main { max-width: 900px; margin: 0 auto; padding: 32px; }
      h1 { margin: 0 0 12px; font-size: 30px; }
      p { color: #a7b0bf; }
      button, .box { width: 100%; margin: 12px 0; border: 1px solid #3d4658; border-radius: 14px; background: #151a24; color: #f5f7fb; padding: 28px; font: inherit; font-size: 20px; cursor: pointer; }
      button:hover, .box:hover { background: #20283a; }
      .box { box-sizing: border-box; user-select: none; }
      #status { margin: 18px 0; border: 1px solid #30405d; border-radius: 14px; background: #111827; padding: 16px; font-size: 18px; }
      #log { margin-top: 18px; border: 1px solid #263042; border-radius: 14px; background: #0d1118; padding: 12px; min-height: 260px; white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 14px; }
      .green { color: #76e39b; }
    </style>
  </head>
  <body>
    <main>
      <h1>Click Events Test</h1>
      <p>This page logs pointer, mouse, focus, and click events. Use Zoottle browser interact to click the controls.</p>
      <button id="button-a">Button A</button>
      <button id="button-b">Button B</button>
      <div id="role-box" class="box" role="button" tabindex="0" aria-label="Role Box">Role Button Box</div>
      <div id="status">Last event: <span id="last" class="green">none</span></div>
      <div id="log">[]</div>
    </main>
    <script>
      const events = [];
      const names = ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'click', 'focus', 'blur'];
      function record(id, event) {
        const item = { id, type: event.type, button: event.button, buttons: event.buttons, x: Math.round(event.clientX || 0), y: Math.round(event.clientY || 0), ts: new Date().toISOString() };
        events.unshift(item);
        events.splice(30);
        document.getElementById('last').textContent = `${item.id} ${item.type} @ ${item.x},${item.y}`;
        document.getElementById('log').textContent = JSON.stringify(events, null, 2);
        document.body.dataset.last = `${item.id}:${item.type}`;
        document.body.dataset.count = String(events.length);
      }
      for (const id of ['button-a', 'button-b', 'role-box']) {
        const el = document.getElementById(id);
        for (const name of names) el.addEventListener(name, (event) => record(id, event));
      }
      window.__clickEvents = {
        events,
        reset() {
          events.splice(0);
          document.body.dataset.last = '';
          document.body.dataset.count = '0';
          document.getElementById('last').textContent = 'none';
          document.getElementById('log').textContent = '[]';
        },
        summary() {
          return { last: document.body.dataset.last || null, count: events.length, events: events.slice() };
        }
      };
      console.log('click events test ready');
    </script>
  </body>
</html>
