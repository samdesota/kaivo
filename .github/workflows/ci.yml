name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck / lint / unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            packages/kaivo-desktop/package-lock.json
            packages/opencode-plugin/package-lock.json
            packages/env-server/package-lock.json
            packages/webframe/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install package dependencies
        run: |
          npm ci --prefix packages/opencode-plugin
          npm ci --prefix packages/env-server
          npm ci --prefix packages/webframe
          npm ci --prefix packages/kaivo-desktop

      - name: Typecheck
        run: |
          npx tsc --noEmit -p tsconfig.server.json
          npx tsc --noEmit -p tsconfig.client.json
          npm run typecheck --prefix packages/opencode-plugin
          npm run typecheck --prefix packages/env-server
          npm run typecheck --prefix packages/kaivo-desktop
      - run: npm run lint
      - run: npm test
      - run: npm test --prefix packages/webframe

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            packages/kaivo-desktop/package-lock.json
            packages/opencode-plugin/package-lock.json
            packages/env-server/package-lock.json
            packages/webframe/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install package dependencies
        run: |
          npm ci --prefix packages/opencode-plugin
          npm ci --prefix packages/env-server
          npm ci --prefix packages/webframe
          npm ci --prefix packages/kaivo-desktop

      - run: npm run build
      - run: npm run build --prefix packages/kaivo-desktop
