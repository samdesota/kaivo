name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  checks:
    name: Typecheck / lint / unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            packages/opencode-plugin/package-lock.json
            packages/env-server/package-lock.json
            packages/zoottle-desktop/package-lock.json

      - name: Configure GitHub Packages
        run: |
          echo "@samdesota:registry=https://npm.pkg.github.com" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install root dependencies
        run: npm ci

      - name: Install package dependencies
        run: |
          npm ci --prefix packages/opencode-plugin
          npm ci --prefix packages/env-server
          npm ci --prefix packages/zoottle-desktop

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            packages/opencode-plugin/package-lock.json
            packages/env-server/package-lock.json
            packages/zoottle-desktop/package-lock.json

      - name: Configure GitHub Packages
        run: |
          echo "@samdesota:registry=https://npm.pkg.github.com" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install root dependencies
        run: npm ci

      - name: Install package dependencies
        run: |
          npm ci --prefix packages/opencode-plugin
          npm ci --prefix packages/env-server
          npm ci --prefix packages/zoottle-desktop

      - run: npm run build
      - run: npm run build:desktop
